<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>面评台 · 在线共享面试评分</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --card2:#fbfbfd; --line:rgba(0,0,0,.08);
    --txt:#1d1d1f; --muted:#86868b; --accent:#0071e3; --accent2:#5e5ce6;
    --good:#34c759; --warn:#ff9f0a; --bad:#ff3b30; --chip:rgba(120,120,128,.10);
    --r:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --grad:linear-gradient(135deg,#0071e3,#5e5ce6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;
    -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
  }
  .topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:12px 20px; background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line);
  }
  .logo{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
  .brand{font-weight:600;font-size:16px;letter-spacing:-.02em}
  .brand small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.14em}
  .grow{flex:1}
  .pill{font-size:12px;color:var(--muted);background:var(--chip);padding:5px 11px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 20px 96px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
  .card+.card{margin-top:16px}
  h1{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:0 0 4px}
  h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
  h3{font-size:15px;font-weight:600;margin:0 0 8px}
  .muted{color:var(--muted)} .small{font-size:12px} .mt{margin-top:14px}.mb{margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center}.end{justify-content:flex-end}
  .btn{
    appearance:none;border:none;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:500;
    cursor:pointer;transition:transform .12s ease,opacity .12s ease,filter .12s ease;
    background:var(--chip);color:var(--txt);font-family:inherit;letter-spacing:-.01em;
  }
  .btn:hover{filter:brightness(.97)} .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.grad{background:var(--grad);color:#fff}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.sm{padding:7px 14px;font-size:13px}
  .btn.lg{padding:14px 26px;font-size:16px}
  .btn.danger{background:transparent;color:var(--bad)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  input,textarea,select{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;letter-spacing:-.01em;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px;font-weight:600;letter-spacing:.02em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .center{max-width:600px;margin:4vh auto}
  .hero{text-align:center;padding:34px 8px 26px}
  .hero .big{font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-.03em}
  .hero p{color:var(--muted);margin:14px auto 26px;max-width:440px;font-size:16px;line-height:1.6}
  .choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
  .choice .card{cursor:pointer;text-align:left;transition:transform .18s ease,box-shadow .18s ease;padding:26px;display:flex;flex-direction:column;margin:0;width:100%;box-sizing:border-box}
  .choice .card+.card{margin-top:0}
  .choice .card .muted{padding-top:10px}
  .chipbtn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .chipbtn:hover{border-color:var(--accent);color:var(--accent)}
  .dropzone{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;background:var(--card2);transition:.15s;margin-bottom:14px}
  .dropzone:hover,.dropzone.on{border-color:var(--accent);color:var(--accent);background:rgba(0,113,227,.05)}
  .resumepaper{background:#fff;color:#1d1d1f;border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-height:64vh;overflow:auto;font-size:14.5px;line-height:1.75;margin-top:12px}
  .resumepaper h1,.resumepaper h2,.resumepaper h3,.resumepaper h4{margin:.6em 0 .3em;font-weight:700}
  .resumepaper p{margin:.4em 0}
  .resumepaper ul,.resumepaper ol{margin:.4em 0;padding-left:1.4em}
  .resumepaper table{border-collapse:collapse;width:100%;margin:.6em 0}
  .resumepaper td,.resumepaper th{border:1px solid #ddd;padding:6px 9px;font-size:13px}
  .resumepaper img{max-width:100%}
  /* ---------- 决策台 ---------- */
  .legend{display:flex;align-items:center;gap:10px;margin:2px 0 14px;font-size:12px;color:var(--muted)}
  .legend .bar-grad{flex:1;height:10px;border-radius:999px;background:linear-gradient(90deg,#cfcfe0,#7c5cff,#3b82f6,#22c55e,#eab308,#f59e0b,#ff3b30,#c0182b)}
  .canvas-card{padding:14px}
  .bins-strip{margin-bottom:14px}
  .bins-strip-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .bins-row{display:flex;gap:12px;flex-wrap:wrap}
  .pool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);transition:.15s}
  .pool.drop-hi{border-color:var(--accent);background:rgba(0,113,227,.06);box-shadow:0 0 0 2px rgba(0,113,227,.18)}
  .pool-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .pool-grid{display:flex;flex-wrap:wrap;gap:10px}
  .bin{flex:1 1 150px;min-width:150px;min-height:150px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);transition:.15s}
  .bin.drop-hi{border-color:var(--accent);background:rgba(0,113,227,.06);transform:translateY(-2px)}
  .bin.reject{border-color:rgba(255,59,48,.3)}
  .bin .chips{flex:1;overflow:auto;align-content:flex-start}
  .bin-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .bin-h .nm{font-weight:700;font-size:14px}
  .bin-h .ct{font-size:12px;color:var(--muted)}
  .bin-h .ic{margin-left:auto;display:flex;gap:4px}
  .bin-h .ic button{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px}
  .bin-h .ic button:hover{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .more{font-size:12px;color:var(--accent);cursor:pointer;margin-top:6px;font-weight:600}
  .ccard{position:relative;border-radius:12px;padding:9px 11px;min-width:84px;cursor:grab;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 4px rgba(0,0,0,.08);user-select:none;transition:transform .12s}
  .ccard:active{cursor:grabbing}
  .ccard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.14)}
  .ccard .cn{font-weight:700;font-size:14px;line-height:1.2}
  .ccard .cs{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
  .ccard .tier{position:absolute;top:6px;right:7px;font-size:10px;font-weight:800;opacity:.85}
  .ccard .rbi{position:absolute;top:6px;left:7px;font-size:11px}
  .ccard .ribbon{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;margin-top:4px;background:rgba(255,255,255,.6);color:#1d1d1f}
  .ccard.rejected{filter:grayscale(.55);opacity:.8}
  .ccard.sel{outline:3px solid var(--accent);outline-offset:1px}
  .cmenu{position:absolute;right:5px;bottom:5px;border:none;background:rgba(255,255,255,.5);border-radius:6px;cursor:pointer;font-size:12px;padding:1px 5px}
  .cmp-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:rgba(29,29,31,.94);color:#fff;border-radius:999px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:13px}
  .cmp-cols{display:grid;gap:14px;margin-top:6px}
  .cm-tip{position:fixed;z-index:70;display:none;background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px 12px;width:210px;font-size:12.5px}
  .cm-tip .t-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-size:13px}
  .cm-tip .t-h span{color:var(--muted);font-size:11px}
  .cm-tip .t-r{display:flex;justify-content:space-between;padding:2px 0;border-top:1px dashed var(--line)}
  .cm-tip .t-r b{font-variant-numeric:tabular-nums}
  .cmp-dock{margin-top:12px;border:1.5px dashed var(--line);border-radius:16px;padding:12px;background:var(--card2);transition:.15s}
  .cmp-dock.drop-hi{border-color:var(--accent);background:rgba(0,113,227,.06)}
  .cmp-dock-h{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .cmp-grid{display:grid;gap:12px}
  .cmp-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
  .cmp-p-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cmp-p-h b{font-size:15px}
  .cmp-p-h .small{color:var(--muted)}
  .cmp-p-h button{margin-left:auto}
  .cmp-radar{display:flex;justify-content:center;margin:4px 0}
  .cmp-resume{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;max-height:240px;overflow:auto}
  .cmp-resume .rp{font-size:12.5px;line-height:1.6;color:#1d1d1f}
  .cmp-resume .rp table{border-collapse:collapse;width:100%}
  .cmp-resume .rp td,.cmp-resume .rp th{border:1px solid #ddd;padding:3px 6px;font-size:11.5px}
  .fs-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;flex-direction:column;padding-top:6px}
  .fs-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(29,29,31,.95);color:#fff;flex-wrap:wrap}
  .fs-bar b{font-size:15px}
  .fs-bar .small{color:#c8c8d0}
  .fs-bar .grow{flex:1}
  .fs-bar .btn{background:rgba(255,255,255,.14);color:#fff}
  .fs-bar .btn.grad{background:var(--accent)}
  .fs-scroll{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center}
  .fs-paper{background:#fff;color:#1d1d1f;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:40px 48px;width:min(1000px,100%);height:max-content;font-size:16px;line-height:1.8}
  .fs-paper h1,.fs-paper h2,.fs-paper h3,.fs-paper h4{margin:.6em 0 .3em;font-weight:700;line-height:1.3}
  .fs-paper p{margin:.5em 0}
  .fs-paper ul,.fs-paper ol{margin:.5em 0;padding-left:1.4em}
  .fs-paper table{border-collapse:collapse;width:100%;margin:.6em 0}
  .fs-paper td,.fs-paper th{border:1px solid #ccc;padding:6px 9px}
  .fs-paper img{max-width:100%}
  .fs-body{flex:1;display:flex;min-height:0;gap:0}
  .fs-body .fs-scroll{flex:1 1 auto;min-width:0}
  .fs-score{flex:0 0 360px;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:16px}
  .fs-score-h{font-weight:700;font-size:15px;margin-bottom:10px}
  .fs-score-in .dim-score{grid-template-columns:96px 1fr 40px}
  /* ---------- AI 助手抽屉 ---------- */
  .ai-fab{position:fixed;right:16px;bottom:92px;z-index:45;width:54px;height:54px;border-radius:50%;background:var(--grad);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28);display:none;place-items:center}
  .ai-drawer{position:fixed;right:16px;bottom:150px;top:auto;left:auto;width:min(380px,92vw);height:min(600px,68vh);min-width:280px;min-height:320px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.28);z-index:80;display:flex;flex-direction:column;overflow:hidden;resize:both;transform:translateY(14px) scale(.98);opacity:0;pointer-events:none;transition:transform .18s ease,opacity .18s ease}
  .ai-drawer.on{transform:none;opacity:1;pointer-events:auto}
  .ai-hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none}
  .ai-hd b{font-size:15px}
  .ai-close{margin-left:auto}
  .ai-hd .drag-hint{font-size:11px;color:var(--muted)}
  .ai-ctx{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .ai-ctx label{display:flex;align-items:center;gap:5px;margin:0 0 0 auto;font-weight:500;color:var(--muted)}
  .ai-ctx input[type=checkbox]{width:auto}
  .ai-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .ai-msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .ai-msg.u{align-self:flex-end;background:var(--accent);color:#fff}
  .ai-msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);white-space:normal}
  .ai-msg.a .md{font-size:13.5px}
  .ai-quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
  .ai-quick button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--txt);font-family:inherit}
  .ai-quick button:hover{border-color:var(--accent);color:var(--accent)}
  .ai-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .ai-in textarea{flex:1;resize:none;height:76px;font-size:14px}
  .ai-in .btn{align-self:flex-end}
  /* ---------- AI 报告：提示词 + 结构化结论 ---------- */
  .ai-prompt-bar{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
  .ai-prompt-edit{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .ai-prompt-edit textarea{min-height:160px;font-size:13px;line-height:1.6;white-space:pre-wrap}
  .ai-report{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-bottom:8px}
  .ai-report.empty-box{padding:0;background:transparent;border:1px dashed var(--line)}
  .md{font-size:14px;line-height:1.75;color:var(--txt)}
  .md h2,.md h3,.md h4{margin:.7em 0 .3em;font-weight:700;letter-spacing:-.01em}
  .md h2{font-size:17px}.md h3{font-size:15.5px}.md h4{font-size:14px}
  .md p{margin:.4em 0}
  .md ul{margin:.3em 0;padding-left:1.3em}
  .md li{margin:.15em 0}
  .md table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:13px}
  .md td,.md th{border:1px solid var(--line);padding:6px 9px;text-align:left}
  .md code{background:rgba(120,120,128,.14);padding:1px 5px;border-radius:5px;font-size:12.5px}
  /* ---------- 说明卡片 ---------- */
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .gcard{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:.15s;min-height:104px}
  .gcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .gcard.open{background:var(--card);border-color:var(--accent)}
  .gq{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:flex-start;gap:8px}
  .gq .gchev{margin-left:auto;color:var(--accent);font-weight:800}
  .ga{margin-top:12px;font-size:14px;line-height:1.7;color:var(--txt);border-top:1px dashed var(--line);padding-top:12px}
  @media(max-width:820px){
    .fs-body{flex-direction:column}
    .fs-score{flex:0 0 auto;border-left:none;border-top:1px solid var(--line);max-height:52vh}
    .fs-scroll{padding:8px}
    .fs-paper{padding:12px 10px;font-size:13.5px;width:100%;box-sizing:border-box}
    .fs-paper table{table-layout:fixed;width:100% !important}
    .fs-paper table col{width:auto !important}
    .fs-paper table td,.fs-paper table th{width:auto !important;max-width:100%;word-break:break-word;overflow-wrap:anywhere;padding:4px 5px;vertical-align:middle}
    .fs-paper img{max-width:100%;height:auto}
  }
  @media(max-width:720px){.cmp-grid{grid-template-columns:1fr 1fr !important}}
  @media(max-width:720px){.bin{flex:1 1 46%;min-width:0;min-height:132px}}
  .choice .card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.10)}
  .choice .ic{font-size:30px}
  .seg{display:flex;gap:2px;background:rgba(120,120,128,.12);padding:3px;border-radius:11px;margin-bottom:16px;overflow-x:auto}
  .seg .tab{padding:8px 15px;border-radius:9px;font-size:14px;font-weight:500;color:var(--txt);cursor:pointer;white-space:nowrap;transition:.15s}
  .seg .tab.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);font-weight:600}
  .codebox{display:flex;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(0,113,227,.06),rgba(94,92,230,.06));border:1px solid rgba(0,113,227,.18);border-radius:16px;padding:16px 18px}
  .joincode{font-size:36px;font-weight:700;letter-spacing:10px;color:var(--accent);font-variant-numeric:tabular-nums}
  .dim-row{display:grid;grid-template-columns:1fr 86px auto;gap:8px;align-items:center;margin-bottom:8px}
  .weight input{padding:9px;text-align:center}
  .list{display:flex;flex-direction:column;gap:12px}
  .cand{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .cand-head{display:flex;align-items:center;gap:10px;padding:16px 18px;cursor:pointer}
  .cand-name{font-weight:600;font-size:16px;letter-spacing:-.01em}
  .dim-score{display:grid;grid-template-columns:118px 1fr 44px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
  .dim-score .lbl{font-size:13px;font-weight:600}
  .dim-score .lbl small{display:block;color:var(--muted);font-size:11px;font-weight:500}
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(120,120,128,.18) var(--fill,50%));border-radius:999px;padding:0;border:none;box-shadow:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;cursor:pointer;border:none;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.04)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border:none;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .scoreval{font-weight:700;font-size:15px;text-align:center;background:var(--chip);border-radius:9px;padding:5px 0;font-variant-numeric:tabular-nums}
  .hint{min-height:15px;font-size:11px;color:var(--muted);margin-top:3px}
  .hint.saved{color:var(--good)}
  .note{margin-top:8px;resize:vertical}
  .rank{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:12px;box-shadow:var(--shadow)}
  .rank .no{font-size:24px;font-weight:700;width:36px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}

  .bar{height:8px;border-radius:999px;background:rgba(120,120,128,.14);overflow:hidden;margin-top:7px}

  .badge.good{color:#1d7a37;background:rgba(52,199,89,.14)}
  .badge.bad{color:#c2261c;background:rgba(255,59,48,.12)}
  .badge.blue{color:var(--accent);background:rgba(0,113,227,.10)}
  .roster{display:flex;flex-wrap:wrap;gap:8px}
  .roster .p{display:flex;align-items:center;gap:7px;background:var(--chip);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500}
  .avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-28px);background:rgba(29,29,31,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:60;max-width:88vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:16px}
  .modal-bg.on{display:grid}
  .modal{width:100%;max-width:460px;max-height:86vh;overflow:auto}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:linear-gradient(0deg,rgba(245,245,247,.96),rgba(245,245,247,0));pointer-events:none;z-index:20}
  .foot .btn{pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  .rep-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .rep-title{font-size:26px;font-weight:700;letter-spacing:-.03em}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  .kpi .k{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;margin-top:2px}
  .rep-sec{margin-top:26px}
  .rep-sec>h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.10em;text-transform:uppercase;margin-bottom:12px}
  .dimbar{margin:7px 0}
  .dimbar .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .dimbar .t b{font-weight:600}
  .dimbar .t .val{color:var(--muted);font-variant-numeric:tabular-nums}
  .dimbar .tr{height:6px;border-radius:999px;background:rgba(120,120,128,.14);overflow:hidden}
  .dimbar .tr>i{display:block;height:100%;border-radius:999px;background:var(--grad)}
  .dimbar .tr>i.hot{background:linear-gradient(90deg,#ff9f0a,#ff3b30)}
  .quote{border-left:3px solid rgba(0,113,227,.35);background:rgba(0,113,227,.04);border-radius:0 10px 10px 0;padding:9px 12px;margin:7px 0;font-size:13px;line-height:1.55}
  .quote .who{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px}
  .alert{border-radius:14px;padding:14px 16px;margin:10px 0;font-size:13.5px;line-height:1.6}
  .alert.warn{background:rgba(255,159,10,.10);border:1px solid rgba(255,159,10,.30);color:#8a4a00}
  .alert.gray{background:var(--chip);border:1px solid var(--line);color:var(--muted)}
  .candcard{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .candcard .hd{display:flex;align-items:center;gap:12px}
  .ring{position:relative;width:56px;height:56px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .exprow{display:flex;flex-wrap:wrap;gap:8px}
  table.stat{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  table.stat th,table.stat td{border:1px solid var(--line);padding:7px 9px;text-align:center}
  table.stat th{background:var(--card2);font-weight:600;color:var(--muted);white-space:nowrap}
  table.stat td:first-child,table.stat th:first-child{text-align:left}
  table.stat tbody tr:nth-child(even){background:rgba(120,120,128,.04)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
  @media(max-width:600px){
    .grid2,.choice{grid-template-columns:1fr}
    .choice{gap:10px}
    .choice .card{height:auto;min-height:140px}
    .center .card.mt{margin-top:22px}
    .dim-score{grid-template-columns:96px 1fr 40px}
    .joincode{font-size:28px;letter-spacing:6px}
    h1{font-size:26px}.hero .big{font-size:30px}
    .kpi{grid-template-columns:repeat(3,1fr);gap:8px}.kpi .v{font-size:20px}
    .wrap{padding:16px 14px 96px}
  }
</style>

<body>
<div class="topbar">
  <div class="logo">面</div>
  <div class="brand">面评台<small>INTERVIEW DESK</small></div>
  <div class="grow"></div>
  <div id="status" class="pill" style="display:none"></div>
</div>
<div class="wrap" id="app"></div>
<div class="foot" id="foot" style="display:none"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal card" id="modal"></div></div>

<script>
/* ============================ 基础 ============================ */
var DIM_SCALE=10;
function api(method,path,body){
  var opt={method:method,headers:{}};var to=null;
  if(typeof AbortController!=='undefined'){var ctrl=new AbortController();opt.signal=ctrl.signal;to=setTimeout(function(){try{ctrl.abort();}catch(e){}},30000);}
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  var clr=function(){if(to){clearTimeout(to);to=null;}};
  return fetch(path,opt).then(function(r){clr();return r.json().catch(function(){return {};}).then(function(j){
    if(!r.ok||j.ok===false){throw new Error(j.error||('请求失败 '+r.status));}
    return j;
  });},function(err){clr();throw new Error(err&&err.name==='AbortError'?'请求超时，请重试':(err&&err.message||'网络错误'));});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function setCookie(k,v){document.cookie=k+'='+encodeURIComponent(JSON.stringify(v))+';path=/;max-age=604800;samesite=lax';}
function getCookie(k){var m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?JSON.parse(decodeURIComponent(m[1])):null;}
function delCookie(k){document.cookie=k+'=;path=/;max-age=0';}
/* 本机快照存储：localStorage 存轻量元数据；IndexedDB 存含简历数据的全量快照（服务端丢失时自动恢复用） */
var MEMST={};
function lsGet(k){try{var v=localStorage.getItem('ivdesk_snap_'+k);if(v!=null)return v;return MEMST[k]||null;}catch(e){return MEMST[k]||null;}}
function lsSet(k,v){try{localStorage.setItem('ivdesk_snap_'+k,v);}catch(e){MEMST[k]=v;}}
function saveSnap(iv){if(iv&&iv.id){try{lsSet(iv.id,JSON.stringify(iv));}catch(e){}}}
var IDB=(function(){
  var dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(function(res,rej){
      if(!window.indexedDB)return rej(new Error('no idb'));
      var r=indexedDB.open('ivdesk_snap',1);
      r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains('snap'))db.createObjectStore('snap');};
      r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
    });
    return dbp;
  }
  return {
    put:function(k,v){return open().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('snap','readwrite');tx.objectStore('snap').put(v,k);tx.oncomplete=function(){res(true);};tx.onerror=function(){rej(tx.error);};});}).catch(function(){return false;});},
    get:function(k){return open().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('snap','readonly');var rq=tx.objectStore('snap').get(k);rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){rej(rq.error);};});}).catch(function(){return null;});}
  };
})();
var _fullSnapTimer=null;
function saveFullSnap(immediate){
  if(!S.interviewId)return;
  clearTimeout(_fullSnapTimer);
  var run=function(){api('GET','/api/backup?id='+encodeURIComponent(S.interviewId)).then(function(r){if(r&&r.interview)IDB.put(S.interviewId,r.interview);}).catch(function(){});};
  if(immediate){run();}else{_fullSnapTimer=setTimeout(run,700);}
}
function _hasResume(){return !!(S.iv&&(S.iv.candidates||[]).some(function(c){return c.resume;}));}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&S.interviewId&&_hasResume())saveFullSnap(true);});
window.addEventListener('pagehide',function(){if(S.interviewId&&_hasResume())saveFullSnap(true);});
function restoreFromLocal(id,role,judgeId){
  return IDB.get(id).then(function(full){
    var iv=full;
    if(!iv){var snap=lsGet(id);if(snap){try{iv=JSON.parse(snap);}catch(e){iv=null;}}}
    if(!iv)return false;
    return importInterviewFull(iv).then(function(r){
      S.interviewId=r.interviewId;
      if(role==='host')S.judgeId=r.hostId||judgeId;
      return true;
    }).catch(function(){return false;});
  });
}
var toastTimer;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},2200);}
var COLORS=['#0071e3','#5e5ce6','#34c759','#ff9f0a','#ff3b30','#32ade6','#af52de','#a2845e'];
function colorOf(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return COLORS[h%COLORS.length];}
function initials(n){return String(n||'?').trim().slice(0,1);}

/* ============================ 状态 ============================ */
var S={role:null,interviewId:null,judgeId:null,iv:null,summary:null,tab:'room',scoreCand:null,aiCfg:null,timer:null,q:'',rankDims:null,reportMode:'detailed',pendingResume:null,cmpSel:[],_binExp:{},_dragCid:null,_dragging:false,_restoring:false,_scanner:null,chat:[],_showPrompt:false,_aiReport:'',_nameHint:'',_nameDebug:null};
var lastJSON='',renderQueued=false,submitLock=false;
function setSession(sess){if(sess){Object.assign(S,sess);setCookie('ivdesk',sess);}else{delCookie('ivdesk');S.role=null;S.iv=null;}}
function loadSession(){var c=getCookie('ivdesk');if(c&&c.interviewId){Object.assign(S,c);return true;}return false;}
function isEditing(){var a=document.activeElement;if(!a)return false;var t=a.tagName;return t==='INPUT'||t==='TEXTAREA'||t==='SELECT';}

/* 轮询：仅当数据真正变化且用户不在输入/拖动时才重渲染，避免打断键盘与滑杆 */
function refresh(force){
  if(!S.interviewId)return Promise.resolve();
  return api('GET','/api/state?id='+encodeURIComponent(S.interviewId)).then(function(r){
    var j=JSON.stringify([r.interview,r.summary]);
    var changed=(j!==lastJSON); lastJSON=j;
    S.iv=r.interview; S.summary=r.summary; updateStatus();
    if(changed||force){saveSnap(r.interview);if((r.interview.candidates||[]).some(function(c){return c.resume;}))saveFullSnap();}
    if(force||changed){
      if(isEditing()){renderQueued=true;}
      else{renderQueued=false;render();}
    }
  }).catch(function(e){
    if(String(e.message).indexOf('不存在')>=0){
      if(S._restoring)return;
      S._restoring=true;
      restoreFromLocal(S.interviewId,S.role,S.judgeId).then(function(ok){
        S._restoring=false;
        if(ok){lastJSON='';refresh(true);toast('已从本机自动恢复该面试间');}
        else{toast('该面试间已结束或不存在');stopPolling();setSession(null);render();}
      });
    }
  });
}
document.addEventListener('focusout',function(){if(renderQueued){renderQueued=false;render();}});
/* 移动端键盘弹起时隐藏底部悬浮按钮，避免遮挡 */
document.addEventListener('focusin',function(e){var t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT')){var f=document.getElementById('foot');if(f&&f.style.display==='flex')f.dataset.hid='1',f.style.display='none';}});
document.addEventListener('focusout',function(e){var t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT')){var f=document.getElementById('foot');if(f&&f.dataset.hid==='1'){delete f.dataset.hid;if(S.role==='judge'&&S.tab==='score'&&S.scoreCand)f.style.display='flex';}}});
function startPolling(){stopPolling();S.timer=setInterval(function(){if(document.visibilityState!=='hidden')refresh(false);},3000);}
function stopPolling(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function updateStatus(){
  var el=document.getElementById('status');
  if(!S.iv){el.style.display='none';return;}
  el.style.display='inline-block';
  el.innerHTML='<span class="dot"></span>'+(S.role==='host'?'主持人':'评委')+' · 评委 '+S.iv.judges.length+' · 候选人 '+S.iv.candidates.length;
}

/* ============================ 渲染入口 ============================ */
var app=document.getElementById('app');
function render(){
  var foot=document.getElementById('foot');foot.style.display='none';foot.innerHTML='';
  try{aiEnsureFab();}catch(e){}
  if(!S.role||!S.iv){return renderHome();}
  if(S.role==='host')return renderHost();
  return renderJudge();
}
/* 搜索：整页重渲染后把焦点还给搜索框；输入法组词期间不重渲染（见 oncomposition* 守卫） */

/* ---------------------------- 首页 ---------------------------- */
function getMine(){return getCookie('ivdesk_mine')||[];}
function pushMine(rec){
  var list=getMine().filter(function(x){return x.id!==rec.id;});
  list.unshift(rec); setCookie('ivdesk_mine',list.slice(0,20));
}
function delMine(i){
  var list=getMine(); var m=list[i]; if(!m)return;
  if(!confirm('从本机历史移除「'+m.name+'」？（不影响服务端数据）'))return;
  list.splice(i,1); setCookie('ivdesk_mine',list); render();
}
function clearMine(){
  if(!confirm('清空本机历史列表？（不影响服务端数据）'))return;
  setCookie('ivdesk_mine',[]); render();
}
function renderHome(){
  var mine=getMine();
  var hist=mine.length?('<div class="card mt"><div class="row mb"><h2>我的面试间（本机历史）</h2><span class="grow"></span>'+
    '<button class="btn sm" onclick="pickImport()">导入历史 JSON</button><button class="btn sm danger" onclick="clearMine()">清空</button></div>'+
    '<div class="list">'+mine.map(function(m,i){
      return '<div class="cand"><div class="cand-head">'+
        '<div class="cand-name" style="cursor:pointer" onclick="reopenMine('+i+')">'+esc(m.name)+'</div>'+
        '<div class="small muted" style="cursor:pointer" onclick="reopenMine('+i+')">'+(m.role==='host'?'主持':'评委')+' · 码 '+esc(m.code||'')+'</div>'+
        '<div class="grow"></div><button class="btn sm primary" onclick="reopenMine('+i+')">重开</button>'+
        '<button class="btn sm danger" onclick="delMine('+i+')">删除</button></div></div>';
    }).join('')+'</div>'+
    '<div class="small muted mt">点“重开”回到面试间；若服务端已重启，会自动从本机缓存恢复。不想要了就“删除”。</div></div>')
    :('<div class="card mt"><div class="row"><h2>有历史数据？</h2><span class="grow"></span><button class="btn sm" onclick="pickImport()">导入历史 JSON 接续</button></div></div>');
  app.innerHTML=
  '<div class="center">'+
    '<div class="hero"><div class="big">面完就忘？<br/>让每场面试可量化、可汇总、<span style="white-space:nowrap">可对比</span></div>'+
    '<p>专为社团招新、活动面试这类小型面试而生。</p></div>'+
    '<div class="choice">'+
      '<div class="card" onclick="openCreate()"><div class="ic">🎤</div><h2 class="mt">我是主持人</h2><div class="muted small mt">创建面试 · 自定义维度 · 生成加入码</div></div>'+
      '<div class="card" onclick="openJoin()"><div class="ic">⚖️</div><h2 class="mt">我是评委</h2><div class="muted small mt">扫码或输入加入码 · 打分</div></div>'+
    '</div>'+hist+
    '<div class="dropzone" style="margin-top:14px" onclick="pickImport()" ondragover="event.preventDefault();this.classList.add(\'on\')" ondragleave="this.classList.remove(\'on\')" ondrop="dropBackup(event)">⬆ 拖入备份 JSON 恢复面试间（或点击选择）</div>'+
    '<div class="row end mt"><button class="btn ghost sm" onclick="openAISettings()">AI 接入设置</button>'+
    '<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="doImport(this)"/></div>'+
  '</div>';
  if(S.pendingJoin){var pj=S.pendingJoin;S.pendingJoin=null;openJoin(pj);}
}
function reopenMine(i){
  var m=getMine()[i]; if(!m)return;
  setSession({role:m.role,interviewId:m.id,judgeId:m.judgeId,iv:null,summary:null,tab:(m.role==='host'?'room':'score'),scoreCand:null});
  startPolling();
  refresh(true).then(function(){
    if(S.iv)return;
    // 服务端已无该面试：尝试从本机快照自动恢复
    return restoreFromLocal(m.id,m.role,m.judgeId).then(function(ok){
      if(ok){lastJSON='';return refresh(true).then(function(){if(S.iv)toast('已从本机恢复该面试间');});}
      toast('本机无缓存快照，请「导入历史 JSON」恢复');
    });
  }).then(function(){ if(!S.iv){setSession(null);render();} });
}
function pickImport(){var f=document.getElementById('importFile');if(f)f.click();}
function doImport(input){var f=input.files&&input.files[0];if(f)importBackupFile(f);input.value='';}

/* ------------------------- 创建面试 ------------------------- */
var draftDims=null;
var DIM_SUGGEST=['积极性/热情','沟通表达','才艺/能力','时间投入','团队契合','责任心','学习意愿','执行力','创造力','抗压能力','协作精神','组织能力','专业基础','形象礼仪'];
function dimsEditorHTML(){
  return '<div class="mt"><label>评分维度（评委按 0–10 打分）</label>'+
    '<div class="row"><input id="dim-input" list="dimopts" placeholder="点击可选，或直接输入自定义维度，回车添加" '+
      'onkeydown="if(event.key===\'Enter\'){event.preventDefault();var i=this;addDim(i.value);i.value=\'\';i.focus();}"/>'+
      '<button class="btn sm primary" onclick="var i=document.getElementById(\'dim-input\');addDim(i.value);i.value=\'\';">添加</button></div>'+
    '<datalist id="dimopts">'+DIM_SUGGEST.map(function(s){return '<option value="'+esc(s)+'"></option>';}).join('')+'</datalist>'+
    '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">'+DIM_SUGGEST.slice(0,9).map(function(s){
      return '<button type="button" class="chipbtn" onclick="addDim(\''+s+'\')">＋ '+s+'</button>';}).join('')+'</div>'+
    '<div id="dims" class="mt"></div>'+
    '<div class="row"><span class="grow"></span><span class="small muted" id="wsum"></span></div>'+
    '<div class="small muted mt">权重总和不必等于 100。</div></div>';
}
function openCreate(){
  draftDims=[];
  showModal(
    '<h2>创建面试</h2><div class="small muted mb">设定本场招新的评价标准。至少添加 1 个维度。</div>'+
    '<div class="grid2"><div><label>面试名称</label><input id="f-name" placeholder="如：摄影社 2026 春季招新"/></div>'+
    '<div><label>你的昵称</label><input id="f-host" placeholder="如：社长 小林"/></div></div>'+
    '<div class="mt"><label>岗位 / 部门说明（可选）</label><input id="f-pos" placeholder="如：活动运营组 · 每周例会 + 2 次外拍"/></div>'+
    dimsEditorHTML()+

function parseJoinCode(txt){
  txt=String(txt||'').trim();
  var m=txt.match(/[?&]join=([A-Za-z0-9]+)/); if(m)return m[1].toUpperCase();
  var m2=txt.match(/\b([A-Za-z0-9]{6})\b/); if(m2)return m2[1].toUpperCase();
  return txt.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
}
function stopScan(){if(S._scanner){try{S._scanner.stop().then(function(){S._scanner.clear();}).catch(function(){});}catch(e){}S._scanner=null;}}
function startScan(){
  var box=document.getElementById('scanbox'); if(!box)return;
  if(box.style.display!=='none'&&S._scanner){stopScan();box.style.display='none';return;}
  box.style.display='block';
  ensure('qrscan').then(function(){
    stopScan();
    S._scanner=new Html5Qrcode('scanbox');
    S._scanner.start({facingMode:'environment'},{fps:10,qrCode:true},
      function(txt){var code=parseJoinCode(txt);var el=document.getElementById('j-code');if(el)el.value=code;stopScan();box.style.display='none';toast('已识别加入码 '+code);var n=document.getElementById('j-nick');if(n)n.focus();},
      function(){}
    ).catch(function(e){box.innerHTML='<div class="small muted" style="padding:10px">无法开启相机：'+esc(e&&e.message||e)+'。请允许摄像头权限，或手动输入加入码。</div>';});
  }).catch(function(){box.innerHTML='<div class="small muted" style="padding:10px">扫码组件加载失败，请手动输入加入码。</div>';});
}
function submitJoin(){

function _pyFn(){var g=window.pinyinPro||window.pinyin;if(!g)return null;if(typeof g==='function')return g;if(typeof g.pinyin==='function')return g.pinyin;return null;}
function pyInitials(name){var f=_pyFn();if(!f)return '';try{var a=f(String(name||''),{pattern:'initial',toneType:'none',type:'array'});return (a||[]).join('').toUpperCase();}catch(e){return '';}}

function matchCand(c,q){
  if(!q)return true;

  var pf=pyFull(c.name);if(pf&&pf.indexOf(q)>=0)return true;
  return false;
}

/* ---------------------------- 决策台（工作台 + 篓子） ---------------------------- */
var HEAT=[[0,'#cfcfe0'],[16,'#a78bfa'],[32,'#3b82f6'],[48,'#22c55e'],[64,'#eab308'],[78,'#f59e0b'],[90,'#ff3b30'],[100,'#c0182b']];
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixc(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}
function colorFor(score){score=Math.max(0,Math.min(100,score||0));
  for(var i=0;i<HEAT.length-1;i++){var s0=HEAT[i][0],s1=HEAT[i+1][0];if(score<=s1){var t=(score-s0)/((s1-s0)||1);var c=mixc(hexRgb(HEAT[i][1]),hexRgb(HEAT[i+1][1]),t);return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}}
  return HEAT[HEAT.length-1][1];
}
function textOn(score){return (score>=68)?'#fff':'#1d1d1f';}
function tierOf(score){return score>=85?'S':score>=70?'A':score>=55?'B':score>=40?'C':'D';}
function computeBinCap(){
  var bins=((S.iv&&S.iv.bins)||[{id:'b'}]).length+1;
  var vw=window.innerWidth||1000;
  var stripW=Math.max(320,Math.min(vw-40,1100));
  var binW=Math.max(150,Math.min(360,stripW/Math.max(1,bins)-12));
  var cols=Math.max(1,Math.floor((binW-24)/92));
  var rows=2; // 允许两行迷你卡
  return Math.max(3,Math.min(12,cols*rows));
}
function scoreMap(){var m={};S.summary.rows.forEach(function(r){m[r.candidateId]=r;});return m;}
function candById(id){var c=null;S.iv.candidates.forEach(function(x){if(x.id===id)c=x;});return c;}
function heatCard(c,row,ctx,map){
  var sc=row?row.finalScore:0,bg=colorFor(sc),tc=textOn(sc);
  var inCmp=(S.cmpSel||[]).indexOf(c.id)>=0;
  var ribbon='';
  if(ctx==='reject')ribbon='<div><span class="ribbon">✕ 淘汰</span></div>';
  else if(ctx&&ctx.indexOf('b:')===0)ribbon='<div><span class="ribbon">✓ '+esc(ctx.slice(2))+'</span></div>';
  return '<div class="ccard '+(ctx==='reject'?'rejected':'')+' '+(inCmp?'sel':'')+'" draggable="true" data-cid="'+c.id+'" style="background:'+bg+';color:'+tc+'" '+
    'onclick="onCardTap(event,\''+c.id+'\')" ondragstart="startDrag(event,\''+c.id+'\')" ondragend="endDrag()" onmouseenter="showHoverTip(event,\''+c.id+'\')" onmouseleave="hideHoverTip()">'+
    '<div class="tier" style="color:'+tc+'">'+tierOf(sc)+'</div>'+
    (c.resume&&c.resume.name?'<div class="rbi">📄</div>':'')+
    '<div class="cn" style="margin-top:10px">'+esc(c.name)+'</div>'+
    '<div class="cs">'+sc+' 分</div>'+ribbon+
  '</div>';
}
function canvasTab(){
  var iv=S.iv;
  if(!iv.candidates.length)return '<div class="card empty">还没有候选人。去「面试间」添加或拖入 Word 简历。</div>';
  var map=scoreMap(),cap=computeBinCap();
  var byScore=function(a,b){return (map[b.id]?map[b.id].finalScore:0)-(map[a.id]?map[a.id].finalScore:0);};
  var pending=iv.candidates.filter(function(c){return !c.binId;}).sort(byScore);
  var bins=iv.bins||[{id:'b_hire',name:'录取'}];
  var reject=iv.candidates.filter(function(c){return c.binId==='__reject__';}).sort(byScore);
  var binHTML=bins.map(function(b){var mem=iv.candidates.filter(function(c){return c.binId===b.id;}).sort(byScore);return binCol(b.id,b.name,mem,cap,false,map);}).join('');
  var rejectHTML=binCol('__reject__','淘汰',reject,cap,true,map);
  return '<div class="card canvas-card">'+
    '<div class="legend"><span>低</span><div class="bar-grad"></div><span>高 · 红=最优</span></div>'+
    '<div class="bins-strip"><div class="bins-strip-h"><span class="small muted">决策篓 · 拖入即决策 · 自动按分排序</span><span class="grow"></span><button class="btn sm" onclick="addBin()">＋ 新增部门</button></div>'+
      '<div class="bins-row">'+binHTML+rejectHTML+'</div></div>'+
    '<div class="pool" ondragover="event.preventDefault();this.classList.add(\'drop-hi\')" ondragleave="this.classList.remove(\'drop-hi\')" ondrop="dropPool(event)">'+
        '<div class="pool-h"><h2 style="margin:0">待定池</h2><span class="badge">'+pending.length+' 人</span><span class="grow"></span><span class="small muted">悬停看详情 · 拖入上方篓子＝决策 · 拖到下方对比台＝并排对比</span></div>'+
        '<div class="pool-grid">'+(pending.length?pending.map(function(c){return heatCard(c,map[c.id],'',map);}).join(''):'<div class="empty">全部已分配</div>')+'</div>'+
    '</div>'+compareDock()+'</div>';
}
function binCol(id,name,mem,cap,isReject,map){
  var expanded=S._binExp&&S._binExp[id];
  var shown=expanded?mem:mem.slice(0,cap);
  var extra=mem.length-shown.length;
  var ic=isReject?'':('<span class="ic"><button title="改名" onclick="renameBin(\''+id+'\')">✎</button>'+(((S.iv.bins||[]).length>1)?'<button title="删除" onclick="delBin(\''+id+'\')">✕</button>':'')+'</span>');
  return '<div class="bin '+(isReject?'reject':'')+'" ondragover="event.preventDefault();this.classList.add(\'drop-hi\')" ondragleave="this.classList.remove(\'drop-hi\')" ondrop="dropBin(event,\''+id+'\')">'+
    '<div class="bin-h"><span class="nm">'+(isReject?'🗑 ':' ')+esc(name)+'</span><span class="ct">'+mem.length+' 人</span>'+ic+'</div>'+
    '<div class="chips">'+(mem.length?shown.map(function(c){return heatCard(c,map[c.id],isReject?'reject':'b:'+name,map);}).join(''):'<span class="small muted">拖入此处</span>')+'</div>'+
    (extra>0?('<div class="more" onclick="expandBin(\''+id+'\')">还有 '+extra+' 人，展开 ▾</div>'):'')+
    (expanded&&mem.length>cap?'<div class="more" onclick="expandBin(\''+id+'\')">收起 ▴</div>':'')+
  '</div>';
}
function startDrag(e,id){hideHoverTip();S._dragCid=id;S._dragging=true;if(e.dataTransfer){e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}}
function endDrag(){setTimeout(function(){S._dragging=false;S._dragCid=null;},60);}
function onCardTap(e,id){if(S._dragging)return;var c=candById(id);if(c&&c.resume&&c.resume.name){openResumeFull(id);}else{openCardDetail(id);}}
function dropPool(e){e.preventDefault();var t=e.currentTarget;if(t)t.classList.remove('drop-hi');if(S._dragCid){assign(S._dragCid,null);}}
function dropBin(e,binId){e.preventDefault();e.stopPropagation();var t=e.currentTarget;if(t)t.classList.remove('drop-hi');if(S._dragCid){assign(S._dragCid,binId);}}
function dropCompare(e){e.preventDefault();e.stopPropagation();var t=e.currentTarget;if(t)t.classList.remove('drop-hi');if(S._dragCid){addCompare(S._dragCid);}}
function assign(candId,binId){api('POST','/api/assign',{interviewId:S.interviewId,candidateId:candId,binId:binId}).then(function(){return refresh(true);}).then(function(){render();}).catch(function(e){toast(e.message);});}
function binsList(){return ((S.iv&&S.iv.bins)||[{id:'b_hire',name:'录取'}]).map(function(b){return {id:b.id,name:b.name};});}
function saveBins(list){api('POST','/api/bins',{interviewId:S.interviewId,bins:list}).then(function(){return refresh(true);}).then(function(){render();}).catch(function(e){toast(e.message);});}

/* ---------------------------- 排行榜 ---------------------------- */
function decBadge(d){if(!d)return '';var cls=d==='录用'?'good':(d==='淘汰'?'bad':'warn');return '<span class="badge '+cls+'">'+esc(d)+'</span>';}
function ownFinal(candId){
  var iv=S.iv,mine=myScores(candId),tw=iv.dimensions.reduce(function(s,d){return s+(Number(d.weight)||0);},0)||1,w=0,any=false;
  iv.dimensions.forEach(function(d){var cell=mine[d.id]||{};if(cell.value!=null){w+=(cell.value/DIM_SCALE)*(Number(d.weight)||0);any=true;}});
  return any?Number((w/tw*100).toFixed(1)):null;
}
function rankTab(){
  var sm=S.summary,iv=S.iv;
  if(!iv.candidates.length)return '<div class="card empty">还没有候选人数据。</div>';
  var allIds=sm.dims.map(function(d){return d.id;});
  var selArr=(S.rankDims&&S.rankDims.length&&S.rankDims.length<allIds.length)?S.rankDims.filter(function(id){return allIds.indexOf(id)>=0;}):allIds.slice();
  if(!selArr.length)selArr=allIds.slice();
  var sel={};selArr.forEach(function(id){sel[id]=1;});
  var isAll=(selArr.length===allIds.length);
  function ss(r){var num=0,den=0;sm.dims.forEach(function(d){if(!sel[d.id])return;den+=(Number(d.weight)||0);var p=null;r.perDim.forEach(function(q){if(q.dimId===d.id)p=q;});if(p&&p.avg!=null)num+=(p.avg/DIM_SCALE)*(Number(d.weight)||0);});return den?Number((num/den*100).toFixed(1)):0;}
  var rows=sm.rows.map(function(r){return {r:r,sc:ss(r)};});
  rows.sort(function(a,b){return b.sc-a.sc;});
  var max=1;rows.forEach(function(x){if(x.sc>max)max=x.sc;});
  var scopeLabel=isAll?'综合（全部维度加权）':('按所选 '+selArr.length+' 项加权平均');
  var chips=sm.dims.map(function(d){var on=!!sel[d.id];return '<button class="btn sm '+(on?'primary':'')+'" onclick="toggleRankDim(\''+d.id+'\')">'+esc(d.label)+'</button>';}).join('');
  var head='<div class="card"><div class="row mb"><h2>排行榜 · '+scopeLabel+'</h2></div>'+
    '<div class="small muted mb">点维度切换排序依据：只点一个＝单因素；点多个＝按这些维度加权平均；「综合」＝全部维度。</div>'+
    '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:14px"><button class="btn sm '+(isAll?'grad':'')+'" onclick="S.rankDims=null;render()">综合</button>'+chips+'</div>';
  var body=rows.map(function(x,i){
    var r=x.r;
    var dimchips=r.perDim.filter(function(p){return p.avg!=null;}).map(function(p){
      return '<span class="badge '+(sel[p.dimId]?'blue':'')+'">'+esc(p.label)+' '+p.avg.toFixed(1)+'</span>';}).join('')||'<span class="small muted">暂无评分</span>';
    var flags='';
    flags+=decBadge(r.decision);
    if(r.judgeCount===0)flags+='<span class="badge">无人评分</span>';
    if(r.divergence>=4)flags+='<span class="badge warn">评委分歧 '+r.divergence.toFixed(1)+'</span>';
    if(r.judgeCount>0&&r.judgeCount<iv.judges.length)flags+='<span class="badge">仅 '+r.judgeCount+'/'+iv.judges.length+' 评委</span>';
    return '<div class="rank '+(i<3?('top'+(i+1)):'')+'">'+
      '<div class="no">'+(i+1)+'</div>'+
      '<div style="flex:1"><div class="row"><div class="cand-name">'+esc(r.name)+'</div>'+flags+
        '<div class="grow"></div><div style="font-weight:700;font-size:22px;font-variant-numeric:tabular-nums">'+x.sc+'</div></div>'+
      '<div class="bar"><i style="width:'+Math.max(4,x.sc/max*100)+'%"></i></div>'+
      '<div class="row mt" style="flex-wrap:wrap">'+dimchips+'</div>'+
      (S.role==='host'?decisionBtns(r.candidateId,r.decision):'')+'</div>'+
      '<div>'+radarMini(r.perDim)+'</div></div>';
  }).join('');
  return head+body+'</div>';
}
function toggleRankDim(id){
  var allIds=S.summary.dims.map(function(d){return d.id;});
  var cur;
  if(!S.rankDims||!S.rankDims.length||S.rankDims.length>=allIds.length){cur=[id];}
  else{cur=S.rankDims.slice();var i=cur.indexOf(id);if(i>=0)cur.splice(i,1);else cur.push(id);if(!cur.length)cur=allIds.slice();}
  S.rankDims=cur;render();
}

function dimBars(perDim){

    return '<div class="dimbar"><div class="t"><b>'+esc(p.label)+'</b><span class="val">均 '+p.avg.toFixed(1)+' / 10'+(hot?(' · 分差 '+p.spread.toFixed(1)):'')+' · '+p.n+' 人评</span></div>'+
      '<div class="tr"><i class="'+(hot?'hot':'')+'" style="width:'+(p.avg/DIM_SCALE*100)+'%"></i></div></div>';
  }).join('')||'<div class="small muted">暂无评分</div>';

function notesFor(candId){
  var iv=S.iv,out=[];
  iv.judges.forEach(function(j){(iv.rounds||[]).forEach(function(rd){iv.dimensions.forEach(function(d){
    var cell=cellOf(candId,j.id,rd.id,d.id);
    if(cell&&cell.note&&cell.note.trim())out.push({who:j.nickname+' · '+rd.label+' · '+d.label,text:cell.note.trim()});
  });
  var g=cellOf(candId,j.id,rd.id,'__general__');
  if(g&&g.note&&g.note.trim())out.push({who:j.nickname+' · '+rd.label+' · 其他备注',text:g.note.trim()});
  });});
  return out;
}
function setReportMode(m){S.reportMode=m;render();}
function statOf(vals){
  var n=vals.length; if(!n)return {n:0};
  var sum=vals.reduce(function(a,b){return a+b;},0), mean=sum/n;
  var sorted=vals.slice().sort(function(a,b){return a-b;});
  var median=(n%2)?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
  var freq={}; vals.forEach(function(v){var k=v.toFixed(1);freq[k]=(freq[k]||0)+1;});
  var maxf=0; Object.keys(freq).forEach(function(k){if(freq[k]>maxf)maxf=freq[k];});
  var modes=maxf>1?Object.keys(freq).filter(function(k){return freq[k]===maxf;}).map(function(k){return parseFloat(k);}):[];
  var variance=vals.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/n;
  return {n:n,mean:mean,median:median,modes:modes,variance:variance,std:Math.sqrt(variance),min:sorted[0],max:sorted[n-1]};
}
function judgeValues(candId,dimId){
  var iv=S.iv,vals=[];
  iv.judges.forEach(function(j){var rounds=iv.rounds||[{id:iv.activeRound}],rv=[];
    rounds.forEach(function(rd){var cell=cellOf(candId,j.id,rd.id,dimId);if(cell&&cell.value!=null)rv.push(cell.value);});
    if(rv.length)vals.push(rv.reduce(function(a,b){return a+b;},0)/rv.length);
  });
  return vals;
}
function judgeTotals(candId){
  var iv=S.iv,tw=iv.dimensions.reduce(function(s,d){return s+(Number(d.weight)||0);},0)||1,vals=[];
  iv.judges.forEach(function(j){var num=0,any=false;
    iv.dimensions.forEach(function(d){var rv=[];(iv.rounds||[{id:iv.activeRound}]).forEach(function(rd){var cell=cellOf(candId,j.id,rd.id,d.id);if(cell&&cell.value!=null)rv.push(cell.value);});
      if(rv.length){var m=rv.reduce(function(a,b){return a+b;},0)/rv.length;num+=(m/DIM_SCALE)*(Number(d.weight)||0);any=true;}});
    if(any)vals.push(Number((num/tw*100).toFixed(1)));
  });
  return vals;
}
function statsTableHTML(candId,dims){
  var rows=dims.map(function(d){var st=statOf(judgeValues(candId,d.id));
    return '<tr><td>'+esc(d.label)+'</td><td>'+(st.n?st.mean.toFixed(1):'—')+'</td><td>'+(st.n?st.median.toFixed(1):'—')+'</td><td>'+(st.n&&st.modes.length?st.modes.join('/'):'—')+'</td><td>'+(st.n?st.variance.toFixed(2):'—')+'</td><td>'+(st.n?st.std.toFixed(2):'—')+'</td><td>'+(st.n||'—')+'</td></tr>';
  }).join('');
  var ct=statOf(judgeTotals(candId));
  rows+='<tr style="font-weight:700;background:rgba(0,113,227,.05)"><td>综合(百分制)</td><td>'+(ct.n?ct.mean.toFixed(1):'—')+'</td><td>'+(ct.n?ct.median.toFixed(1):'—')+'</td><td>'+(ct.n&&ct.modes.length?ct.modes.join('/'):'—')+'</td><td>'+(ct.n?ct.variance.toFixed(1):'—')+'</td><td>'+(ct.n?ct.std.toFixed(1):'—')+'</td><td>'+(ct.n||'—')+'</td></tr>';
  return '<table class="stat"><thead><tr><th>维度</th><th>平均</th><th>中位数</th><th>众数</th><th>方差</th><th>标准差</th><th>人数</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function importBackupFile(file){
  if(!/\.json$/i.test(file.name)){toast('请选择 .json 备份文件');return;}
  var fr=new FileReader();
  fr.onload=function(){
    try{

      if(!iv||!iv.id){toast('不是有效的备份文件');return;}
      importInterviewFull(iv).then(function(r){
        pushMine({id:r.interviewId,name:iv.name||'恢复的面试',code:r.code,role:'host',judgeId:r.hostId});
        toast('已导入，正在恢复…');
        setSession({role:'host',interviewId:r.interviewId,judgeId:r.hostId,iv:null,summary:null,tab:'room',scoreCand:null});
        startPolling();return refresh(true);
      }).then(function(){render();}).catch(function(e){toast(e.message);});
    }catch(e){toast('文件解析失败：'+e.message);}
  };
  fr.readAsText(file);
}

/* ---------------------------- 打分面板 ---------------------------- */
function curRoundId(){return (S.iv&&S.iv.activeRound)||((S.iv&&S.iv.rounds&&S.iv.rounds[0]&&S.iv.rounds[0].id)||'r1');}
function cellOf(candId,judgeId,roundId,dimId){return ((((S.iv.scores[candId]||{})[judgeId]||{})[roundId]||{})[dimId]);}
function myScores(candId){return (((S.iv.scores[candId]||{})[S.judgeId]||{})[curRoundId()]||{});}
function fillPct(v){return (Number(v)/DIM_SCALE*100)+'%';}
function scoringBody(candId,scope){
  var iv=S.iv,c=null;
  for(var i=0;i<iv.candidates.length;i++){if(iv.candidates[i].id===candId)c=iv.candidates[i];}
  if(!c)return '';
  var mine=myScores(candId);var sc=scope||'';
  return iv.dimensions.map(function(d){
    var cell=mine[d.id]||{};var v=(cell.value==null?'':cell.value);var note=cell.note||'';
    var shown=(v===''?DIM_SCALE/2:v);
    return '<div class="dim-score">'+
      '<div class="lbl">'+esc(d.label)+'<small>权重 '+d.weight+'</small></div>'+
      '<div><input type="range" min="0" max="'+DIM_SCALE+'" step="0.5" value="'+shown+'" style="--fill:'+fillPct(shown)+'" '+
        'oninput="this.style.setProperty(\'--fill\',fillPct(this.value));this.parentNode.nextElementSibling.textContent=this.value" '+
        'onchange="saveScore(\''+c.id+'\',\''+d.id+'\',Number(this.value),\''+sc+'\')" />'+
        '<div class="hint" id="hint-'+sc+'-'+d.id+'">'+(v===''?'未评 · 拖动即保存':'')+'</div></div>'+
      '<div class="scoreval">'+(v===''?'–':v)+'</div></div>'+
      '<textarea class="note" rows="2" data-cid="'+c.id+'" data-dim="'+d.id+'" enterkeyhint="done" placeholder="备注：亮点 / 顾虑 / 原话…" oninput="queueNote(\''+c.id+'\',\''+d.id+'\',this.value)" onblur="flushNoteOne(\''+c.id+'\',\''+d.id+'\',this.value)">'+esc(note)+'</textarea>';
  }).join('')+
  (function(){var g=((((iv.scores[candId]||{})[S.judgeId]||{})[curRoundId()]||{})['__general__'])||{};
    return '<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px">'+
      '<label>其他备注（综合补充，不计入打分）</label>'+
      '<textarea class="note" rows="2" data-cid="'+candId+'" data-dim="__general__" enterkeyhint="done" placeholder="与该候选人整体相关的补充信息、印象、顾虑等…" oninput="queueNote(\''+candId+'\',\'__general__\',this.value)" onblur="flushNoteOne(\''+candId+'\',\'__general__\',this.value)">'+esc(g.note||'')+'</textarea></div>';})();
}
function scoringPanel(candId){
  var iv=S.iv,c=null;
  for(var i=0;i<iv.candidates.length;i++){if(iv.candidates[i].id===candId)c=iv.candidates[i];}
  if(!c)return '<div class="empty">候选人不存在</div>';
  var back=S.role==='host'?"closeModal();S.tab='room';render()":"S.scoreCand=null;render()";
  return '<div class="card">'+
    '<div class="row mb"><button class="btn sm ghost" onclick="'+back+'">‹ 返回</button>'+
    '<div><div class="cand-name">'+esc(c.name)+'</div><div class="small muted">'+esc(c.info||'')+'</div></div>'+
    '<div class="grow"></div>'+(c.resume&&c.resume.name?'<button class="btn sm" onclick="viewResume(\''+c.id+'\')">📄 简历+打分</button>':'')+'</div>'+
    '<div class="small muted mb">凭你自己的判断拖动滑杆打分（0–10），即时保存；写完可点底部「完成并保存」。</div>'+
    scoringBody(candId,'')+
    '<div class="row end mt"><button class="btn grad" style="width:100%" onclick="finishScoring()">✓ 完成并保存本场评分</button></div>'+
    '</div>';
}
function saveScore(candId,dimId,value,scope){
  var hint=document.getElementById('hint-'+(scope||'')+'-'+dimId);
  if(hint){hint.textContent='保存中…';hint.classList.remove('saved');}
  api('POST','/api/score',{interviewId:S.interviewId,judgeId:S.judgeId,candidateId:candId,dimId:dimId,roundId:curRoundId(),value:value})
  .then(function(){if(hint){hint.textContent='已保存';hint.classList.add('saved');}})
  .catch(function(e){if(hint){hint.textContent='保存失败：'+e.message;}});
}
var noteTimers={};
function queueNote(candId,dimId,text){
  clearTimeout(noteTimers[candId+'|'+dimId]);
  noteTimers[candId+'|'+dimId]=setTimeout(function(){
    api('POST','/api/score',{interviewId:S.interviewId,judgeId:S.judgeId,candidateId:candId,dimId:dimId,roundId:curRoundId(),note:text}).catch(function(){});
  },700);
}
function flushNoteOne(candId,dimId,text){
  clearTimeout(noteTimers[candId+'|'+dimId]);
  api('POST','/api/score',{interviewId:S.interviewId,judgeId:S.judgeId,candidateId:candId,dimId:dimId,roundId:curRoundId(),note:text}).catch(function(){});
}
function flushNotes(candId){
  var tas=document.querySelectorAll('textarea.note[data-cid="'+candId+'"]');
  var ps=[];
  tas.forEach(function(ta){
    var dimId=ta.getAttribute('data-dim');clearTimeout(noteTimers[candId+'|'+dimId]);
    ps.push(api('POST','/api/score',{interviewId:S.interviewId,judgeId:S.judgeId,candidateId:candId,dimId:dimId,roundId:curRoundId(),note:ta.value}).catch(function(){}));
  });
  return Promise.all(ps);
}
// 保存时：把当前评委/场次下仍未评的维度按默认 5 分写入
function commitDefaults(candId){
  var iv=S.iv,mine=myScores(candId);
  var ps=iv.dimensions.filter(function(d){var c=mine[d.id]||{};return c.value==null;}).map(function(d){
    return api('POST','/api/score',{interviewId:S.interviewId,judgeId:S.judgeId,candidateId:candId,dimId:d.id,roundId:curRoundId(),value:DIM_SCALE/2}).catch(function(){});
  });
  return Promise.all(ps);
}
function finishScoring(){
  var candId=S.scoreCand;
  var done=function(){
    toast('本场评分已保存');
    if(S.role==='host'){closeModal();S.tab='room';}
    else{S.scoreCand=null;}
    render();
  };
  if(candId){Promise.all([flushNotes(candId),commitDefaults(candId)]).then(done);}else{done();}
}

function mdToHtml(md){
  function inline(s){s=esc(s);s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');return s;}
  var lines=String(md||'').split('\n'),out=[],inList=false,inTbl=false;
  function closeList(){if(inList){out.push('</ul>');inList=false;}}
  function closeTbl(){if(inTbl){out.push('</table>');inTbl=false;}}
  for(var i=0;i<lines.length;i++){var ln=lines[i];
    if(/^\s*[-*]\s+/.test(ln)){if(!inList){closeTbl();out.push('<ul>');inList=true;}out.push('<li>'+inline(ln.replace(/^\s*[-*]\s+/,''))+'</li>');continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){closeList();if(/^[\s|:\-]+$/.test(ln))continue;var cells=ln.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim();});if(!inTbl){out.push('<table>');inTbl=true;}out.push('<tr>'+cells.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>');continue;}
    closeList();closeTbl();
    var h=ln.match(/^(#{1,4})\s+(.*)/);if(h){var lv=Math.min(4,h[1].length+1);out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>');continue;}
    if(/^\s*$/.test(ln)){continue;}
    out.push('<p>'+inline(ln)+'</p>');
  }
  closeList();closeTbl();
  return '<div class="md">'+out.join('')+'</div>';
}

  } else {

      var ct=statOf(judgeTotals(r.candidateId));
      L.push('| **综合(百分制)** | '+(ct.n?ct.mean.toFixed(1):'—')+' | '+(ct.n?ct.median.toFixed(1):'—')+' | '+(ct.n&&ct.modes.length?ct.modes.join('/'):'—')+' | '+(ct.n?ct.variance.toFixed(1):'—')+' | '+(ct.n?ct.std.toFixed(1):'—')+' | '+(ct.n||'—')+' |');

function expPDF(){

  }).then(function(canvas){
    var pdf=new window.jspdf.jsPDF('p','mm','a4');
    var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    var margin=10,iw=pw-margin*2;
    var ih=canvas.height*iw/canvas.width;
    var pageH=ph-margin*2;
    if(ih<=pageH){pdf.addImage(canvas.toDataURL('image/png'),'PNG',margin,margin,iw,ih);}
    else{
      var slicePx=canvas.width*pageH/iw;
      var pos=0;
      while(pos<canvas.height){
        var hpx=Math.min(slicePx,canvas.height-pos);
        var cv=document.createElement('canvas');cv.width=canvas.width;cv.height=hpx;
        cv.getContext('2d').drawImage(canvas,0,pos,canvas.width,hpx,0,0,canvas.width,hpx);
        if(pos>0)pdf.addPage();
        pdf.addImage(cv.toDataURL('image/png'),'PNG',margin,margin,iw,hpx*iw/canvas.width);
        pos+=hpx;
      }
    }
    pdf.save(safeName()+'.pdf');
    toast('已导出 PDF');
  }).catch(function(e){toast('PDF 生成失败：'+e.message);});
}

function nameFromFilename(fn){
  var base=String(fn||'').replace(/\.[^.]+$/,'');
  // 无 AI 时的文件名兜底：取“最后一段”并剥离年级/噪声；取不到就返回空（交给 AI 或手填），绝不硬猜成校区
  var parts=base.split(/[-_\s]+/).filter(Boolean);
  var last=parts.length?parts[parts.length-1]:base;
  last=last.replace(/\d+/g,'').replace(/(级|年|班|专业|学院|大学|学校|本科|硕士|博士|研究生|简历|求职|个人|中文版|英文版|最终|定稿|终稿|副本|修改版|版|resume|cv)/gi,'').trim();
  var m=last.match(/^[\u4e00-\u9fa5][\u4e00-\u9fa5·]{1,3}$/); if(m)return m[0];
  var e=last.match(/^[A-Za-z]{2,}(?:\s+[A-Za-z]{2,}){0,2}$/); if(e)return e[0].trim();
  return '';
}
function extractNameFromText(text){
  text=String(text||'').replace(/\r/g,'');
  // 优先正文“姓名”栏（冒号/空格可有可无）
  var m=text.match(/姓\s*名[\s:：]{0,3}([\u4e00-\u9fa5][\u4e00-\u9fa5·]{1,3})/); if(m)return m[1].trim();
  var m2=text.match(/(?:name|姓名)\s*[:：]?\s*([A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,2})/i); if(m2)return m2[1].trim();
  var lines=text.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  for(var i=0;i<Math.min(lines.length,8);i++){var L=lines[i];
    if(/^[\u4e00-\u9fa5][\u4e00-\u9fa5·]{1,3}$/.test(L))return L;
    if(/^[A-Z][a-z]+(\s+[A-Z][a-z]+){1,2}$/.test(L))return L;
  }
  return '';
}
function cleanName(s){
  s=String(s||'');
  var t=s.trim();
  var zh=t.replace(/[^\u4e00-\u9fa5·]/g,'');
  if(zh.length>=2&&zh.length<=4)return zh; // 模型只回了名字
  var m=s.match(/(?:姓名|名字|叫|是|为)\s*[:：=]?\s*([\u4e00-\u9fa5·]{2,4})/); if(m)return m[1];
  var all=s.match(/[\u4e00-\u9fa5·]{2,4}/g); if(all&&all.length)return all[all.length-1];
  var e=t.match(/[A-Za-z][A-Za-z]{1,12}(?:\s+[A-Za-z]{1,12}){0,2}/); if(e)return e[0].trim();
  return '';
}
function docxTextViaZip(buf){
  return new window.JSZip().loadAsync(buf).then(function(zip){
    var f=zip.file('word/document.xml'); if(!f)return '';
    return f.async('string').then(function(xml){
      var m=xml.match(/<w:t[^>]*>([^<]*)<\/w:t>/g)||[];
      return m.map(function(x){return x.replace(/<[^>]+>/g,'');}).join(' ').replace(/\s+/g,' ').trim();
    });
  }).catch(function(){return '';});
}
function detectName(file,text){

    .then(function(t){S._nameDebug.raw=String(t||'').slice(0,120);var nn=cleanName(t);
      if(nn){S._nameHint='';return nn;}

    .catch(function(e){S._nameDebug.raw='(error) '+e.message;S._nameHint='AI 调用失败：'+e.message+'。请检查「配置 AI」或手动填写。';return local;});
}
function resumeText(file){
  var ext=(String(file.name||'').split('.').pop()||'').toLowerCase();
  if(ext==='txt'||ext==='md'){return file.text();}
  if(ext==='pdf'){
    return ensure('pdf').then(function(){return file.arrayBuffer();}).then(function(buf){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=CDN.pdfworker;
      return window.pdfjsLib.getDocument({data:buf}).promise;
    }).then(function(doc){
      var ps=[];
      for(var i=1;i<=Math.min(doc.numPages,3);i++){
        ps.push(doc.getPage(i).then(function(p){return p.getTextContent();}).then(function(tc){return tc.items.map(function(x){return x.str;}).join(' ');}));
      }
      return Promise.all(ps).then(function(a){return a.join('\n');});
    });
  }
  if(ext==='docx'){
    return file.arrayBuffer().then(function(buf){
      return ensure('mammoth').then(function(){return window.mammoth.extractRawText({arrayBuffer:buf.slice(0)});}).then(function(r){return (r&&r.string)||'';})
        .then(function(txt){ if(txt.trim())return txt; return ensure('zip').then(function(){return docxTextViaZip(buf);}); });
    });
  }
  if(ext==='doc'){return Promise.reject(new Error('旧版 .doc 暂不支持，请用 .docx 或手动添加'));}
  return Promise.reject(new Error('暂不支持该格式，请用 Word(.docx) 或手动添加'));
}
function processResumeFiles(files){

  if(arr.length===1){processResumeFile(arr[0]);return;}
  toast('正在识别 '+arr.length+' 份简历…');
  Promise.all(arr.map(function(f){
    return fileToBase64(f).then(function(b64){
      return resumeText(f).then(function(text){return detectName(f,text).then(function(nm){return {filename:f.name,base64:b64,name:nm};});})
        .catch(function(){return {filename:f.name,base64:b64,name:nameFromFilename(f.name)};});
    }).catch(function(){return null;});
