function b64ToBytes(b64){var bin=atob(b64);var len=bin.length;var arr=new Uint8Array(len);for(var i=0;i<len;i++)arr[i]=bin.charCodeAt(i);return arr;}
function openResumeManager(candId){
  var c=findCand(candId); if(!c)return;
  var has=c.resume&&c.resume.name;
  showModal('<h2>'+esc(c.name)+' · 简历</h2>'+
    (has?('<div class="alert gray" style="margin:0 0 10px">当前简历：<b>'+esc(c.resume.name)+'</b>（'+((c.resume.size||0)/1024).toFixed(0)+' KB）</div>'):('<div class="small muted mb">尚未上传简历。仅支持 Word (.docx)。</div>'))+
    '<div class="row" style="flex-wrap:wrap;gap:8px">'+
      (has?'<button class="btn sm primary" onclick="viewResume(\''+candId+'\')">🔍 全屏查看</button><button class="btn sm" onclick="downloadResume(\''+candId+'\')">下载原件</button>':'')+
      '<button class="btn sm" onclick="pickResumeFor(\''+candId+'\')">'+(has?'替换简历':'上传 Word 简历')+'</button>'+
      (has?'<button class="btn sm danger" onclick="deleteResume(\''+candId+'\')">删除</button>':'')+
    '</div>'+
    '<div class="dropzone" style="margin:12px 0 0" onclick="pickResumeFor(\''+candId+'\')" ondragover="event.preventDefault();this.classList.add(\'on\')" ondragleave="this.classList.remove(\'on\')" ondrop="resumeDrop(event,\''+candId+'\')">把 Word 简历拖到这里上传（或点击选择）</div>'+
    '<input type="file" id="resumeUp" accept=".docx" style="display:none" onchange="if(this.files[0])uploadResume(\''+candId+'\',this.files[0]);this.value=\'\'"/>'+
    '<div class="row end mt"><button class="btn" onclick="closeModal()">关闭</button></div>');
}
function resumeDrop(e,candId){e.preventDefault();e.stopPropagation();var dz=e.currentTarget;if(dz)dz.classList.remove('on');var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)uploadResume(candId,f);}
function pickResumeFor(candId){var f=document.getElementById('resumeUp');if(f)f.click();}
function uploadResume(candId,file){
  if(!/\.docx$/i.test(file.name)){toast('简历仅支持 Word (.docx)');return;}
  toast('上传中…');
  fileToBase64(file).then(function(b64){
    return uploadResumeChunks(candId,file.name,b64);
  }).then(function(){return refresh(true);}).then(function(){openResumeManager(candId);toast('简历已保存');}).catch(function(e){toast('上传失败：'+(e.message||e));});
}
function deleteResume(candId){
  if(!confirm('删除该候选人的简历？'))return;
  api('POST','/api/candidate/resume/delete',{interviewId:S.interviewId,candidateId:candId}).then(function(){return refresh(true);}).then(function(){openResumeManager(candId);toast('已删除');}).catch(function(e){toast(e.message);});
}
function viewResume(candId){openResumeFull(candId);}
function loadResumeHtml(candId){
  return api('GET','/api/candidate/resume?interviewId='+encodeURIComponent(S.interviewId)+'&candidateId='+encodeURIComponent(candId)).then(function(r){
    var bytes=b64ToBytes(r.dataBase64);
    var zbytes=bytes.slice(0);
    var ab=bytes.buffer;
    var plain=function(){return ensure('zip').then(function(){return docxTextViaZip(zbytes);}).then(function(t){return t?'<pre style="white-space:pre-wrap;font-size:14px;line-height:1.7">'+esc(t)+'</pre>':'';});};
    return ensure('mammoth').then(function(){return window.mammoth.convertToHtml({arrayBuffer:ab});}).then(function(res){
      if(res&&res.value&&String(res.value).trim())return res.value;
      return plain();
    }).catch(function(){return plain();});
  });
}
function openResumeFull(candId){
  var c=findCand(candId); if(!c||!c.resume)return;
  var ov=document.getElementById('fsOverlay');
  if(!ov){ov=document.createElement('div');ov.id='fsOverlay';ov.className='fs-overlay';document.body.appendChild(ov);
    ov.addEventListener('wheel',function(e){if(e.ctrlKey){e.preventDefault();S._fsZoom=Math.max(0.6,Math.min(3,(S._fsZoom||1)+(e.deltaY<0?0.1:-0.1)));applyFsZoom();}},{passive:false});
    // 点击空白背景（非简历纸面、非打分面板）即退出；退出保留草稿（仅桌面，避免手机拖动误触）
    ov.addEventListener('click',function(e){if(('ontouchstart' in window)||navigator.maxTouchPoints>0)return;var t=e.target;if(t===ov||(t.classList&&(t.classList.contains('fs-body')||t.classList.contains('fs-scroll')))){closeResumeFull();}});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.style.display==='flex'){closeResumeFull();}});
  }
  S._fsZoom=1;S._fsCand=candId;
  ov.innerHTML='<div class="fs-body">'+
      '<div class="fs-scroll"><div class="fs-paper" id="fsPaper">正在解析 Word…</div></div>'+
      '<div class="fs-score"><div class="fs-score-h"><span>'+esc(c.name)+' · 打分</span></div>'+
        '<div class="fs-score-in">'+scoringBody(candId,'fs')+'</div>'+
        (S.role==='host'?decisionBtns(candId,c.decision):'')+
        '<button class="btn grad" style="width:100%;margin-top:14px" onclick="closeResumeFull()">✓ 完成并保存</button>'+
      '</div>'+
    '</div>';
  ov.style.display='flex';
  // 移动端：像看图一样双指缩放、单指拖动、双击复位
  var scEl=ov.querySelector('.fs-scroll'),pp=document.getElementById('fsPaper');
  if(scEl&&pp&&(('ontouchstart' in window)||navigator.maxTouchPoints>0)){
    scEl.style.overflow='hidden';scEl.style.touchAction='none';
    var vst={s:1,x:0,y:0};
    var vapply=function(){pp.style.transformOrigin='0 0';pp.style.transform='translate('+vst.x+'px,'+vst.y+'px) scale('+vst.s+')';};
    var sd=0,ss=1,lx=0,ly=0,lastTap=0;
    var dist=function(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);};
    scEl.addEventListener('touchstart',function(e){if(e.touches.length===2){sd=dist(e.touches);ss=vst.s;}else if(e.touches.length===1){lx=e.touches[0].clientX;ly=e.touches[0].clientY;}},{passive:false});
    scEl.addEventListener('touchmove',function(e){if(e.touches.length===2){e.preventDefault();var d=dist(e.touches);vst.s=Math.max(0.5,Math.min(5,ss*(d/(sd||d))));vapply();}else if(e.touches.length===1){e.preventDefault();vst.x+=e.touches[0].clientX-lx;vst.y+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;vapply();}},{passive:false});
    scEl.addEventListener('touchend',function(){var n=Date.now();if(n-lastTap<300){vst.s=1;vst.x=0;vst.y=0;vapply();}lastTap=n;});
  }
  loadResumeHtml(candId).then(function(html){var p=document.getElementById('fsPaper');if(p)p.innerHTML=html||'（无可显示文本）';applyFsZoom();})
  .catch(function(e){var p=document.getElementById('fsPaper');if(p)p.innerHTML='简历解析失败：'+esc(e.message);});
}
function openScore(candId){var c=candById(candId);if(c&&c.resume&&c.resume.name){openResumeFull(candId);}else{openScoring(candId);}}
function applyFsZoom(){var p=document.getElementById('fsPaper');if(p)p.style.fontSize=(16*(S._fsZoom||1))+'px';var z=document.getElementById('fsZoomTxt');if(z)z.textContent=Math.round((S._fsZoom||1)*100)+'%';}
function fsZoom(d){S._fsZoom=Math.max(0.6,Math.min(3,(S._fsZoom||1)+d));applyFsZoom();}
function fsZoomReset(){S._fsZoom=1;applyFsZoom();}
function closeResumeFull(){var cand=S._fsCand;var ov=document.getElementById('fsOverlay');if(ov)ov.style.display='none';if(cand){Promise.all([flushNotes(cand),commitDefaults(cand)]).then(function(){return refresh(true);}).then(function(){render();});}}
function downloadResume(candId){
  api('GET','/api/candidate/resume?interviewId='+encodeURIComponent(S.interviewId)+'&candidateId='+encodeURIComponent(candId)).then(function(r){
    var bytes=b64ToBytes(r.dataBase64);
    download(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),r.filename||'resume.docx');
    toast('已下载原件');
  }).catch(function(e){toast(e.message);});
}
function openScoring(candId){S.scoreCand=candId;showModal(scoringPanel(candId));showFoot();}

/* ---------------------------- 决策 / 评委 / 盲评 / 维度 ---------------------------- */
function setDecision(candId,val){
  api('POST','/api/candidate/decision',{interviewId:S.interviewId,candidateId:candId,decision:val})
  .then(function(){return refresh(true);}).then(function(){render();}).catch(function(e){toast(e.message);});
}
function removeJudge(judgeId){
  var j=null;S.iv.judges.forEach(function(x){if(x.id===judgeId)j=x;});
  if(!confirm('移除评委「'+(j?j.nickname:'')+'」及其全部评分？'))return;
  api('POST','/api/judge/delete',{interviewId:S.interviewId,judgeId:judgeId})
  .then(function(){return refresh(true);}).then(function(){render();}).catch(function(e){toast(e.message);});
}
function toggleBlind(){
  api('POST','/api/settings',{interviewId:S.interviewId,blind:!S.iv.blind})
  .then(function(){return refresh(true);}).then(function(){render();toast(S.iv.blind?'已开启盲评':'已关闭盲评');}).catch(function(e){toast(e.message);});
}
function openEditDims(){
  draftDims=S.iv.dimensions.map(function(d){return {id:d.id,label:d.label,weight:d.weight};});
  showModal('<h2>编辑维度 / 权重</h2><div class="small muted mb">修改后按新权重重新计算汇总。已有打分按维度 id 保留。</div>'+
    dimsEditorHTML()+
    '<div class="row end mt"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitEditDims()">保存</button></div>');
  renderDims();
}
function submitEditDims(){
  var dims=draftDims.filter(function(d){return d.label&&d.label.trim();}).map(function(d){return {id:d.id,label:d.label.trim(),weight:Number(d.weight)||0};});
  if(!dims.length){toast('至少保留一个维度');return;}
  api('POST','/api/dimensions',{interviewId:S.interviewId,dimensions:dims})
  .then(function(){closeModal();return refresh(true);}).then(function(){render();toast('维度已更新');}).catch(function(e){toast(e.message);});
}

/* ---------------------------- 扫码直达 ---------------------------- */
function joinUrl(){return location.origin+location.pathname+'?join='+encodeURIComponent(S.iv.code);}
function copyLink(){copyText(joinUrl(),'扫码链接已复制');}
function queueQR(){
  requestAnimationFrame(function(){
    var box=document.getElementById('qrbox'); if(!box||!S.iv)return;
    ensure('qr').then(function(){
      box.innerHTML='';
      new QRCode(box,{text:joinUrl(),width:132,height:132,correctLevel:QRCode.CorrectLevel.M});
    }).catch(function(){ box.innerHTML='<div class="small muted" style="max-width:132px">二维码加载失败<br/>可改用加入码</div>'; });
  });
}

/* ---------------------------- 复制 / 设置 / 会话 ---------------------------- */
function copyCode(){copyText(S.iv.code,'加入码已复制');}
function copyText(t,ok){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(ok);});}
  else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(ok);}
}
function openAISettings(){
  var sa=serverAI();var cfg=S.aiCfg||{};
  var base=cfg.base||(sa&&sa.base)||'';
  var model=cfg.model||(sa&&sa.model)||'';
  var proto=cfg.protocol||(sa&&sa.protocol)||'auto';
  showModal('<h2>AI 接入设置</h2>'+
    '<div class="small muted mb">AI 只做<b>统计与归纳</b>（汇总、排序、算分差并写成客观结论），<b>打分与录用由人决定</b>。不配置也能用内置统计模板。</div>'+
    '<label>协议格式</label><select id="ai-proto">'+
      '<option value="auto"'+(proto==='auto'?' selected':'')+'>自动（按地址判断）</option>'+
      '<option value="openai"'+(proto==='openai'?' selected':'')+'>OpenAI 兼容（/chat/completions）</option>'+
      '<option value="anthropic"'+(proto==='anthropic'?' selected':'')+'>Anthropic 兼容（/v1/messages）</option></select>'+
    '<div class="mt"><label>接口地址 Base URL</label><input id="ai-base" value="'+esc(base)+'" placeholder="OpenAI兼容填 https://api.deepseek.com"/>'+
    '<div class="small muted mt">示例：DeepSeek(OpenAI兼容) <b>https://api.deepseek.com</b> + 模型 <b>DeepSeek-flash</b>。</div></div>'+
    '<div class="mt"><label>模型名称</label><input id="ai-model" value="'+esc(model)+'" placeholder="如 DeepSeek-flash / gpt-4o-mini"/></div>'+
    '<div class="mt"><label>API Key</label><input id="ai-key" type="password" placeholder="'+(sa?'已保存（留空则沿用）':'sk-...')+'"/></div>'+
    '<div class="small muted mt">配置保存在服务端并绑定本场面试，重开自动记住；Key 只存服务端、不下发前端。</div>'+
    '<div class="row end mt"><button class="btn" onclick="closeModal()">关闭</button><button class="btn" onclick="testAISet()">测试连接</button><button class="btn primary" onclick="saveAISet()">保存</button></div>'+
    '<div id="ai-test" class="small muted mt"></div>');
}
function readAISet(){return {base:document.getElementById('ai-base').value.trim(),model:document.getElementById('ai-model').value.trim(),key:document.getElementById('ai-key').value.trim(),protocol:document.getElementById('ai-proto').value};}
function saveAICfg(){try{localStorage.setItem('ivdesk_aicfg',JSON.stringify(S.aiCfg));}catch(e){}}
function loadAICfg(){try{var v=localStorage.getItem('ivdesk_aicfg');if(v)S.aiCfg=JSON.parse(v);}catch(e){}}
function testAISet(){
  var cfg=readAISet();var box=document.getElementById('ai-test');
  if(!cfg.base&&!serverAI()){box.textContent='请先填接口地址';return;}
  if(!cfg.key&&!serverAI()){box.textContent='请填写 API Key';return;}
  box.textContent='测试中…';
  api('POST','/api/ai',{interviewId:S.interviewId,base:cfg.base,key:cfg.key,model:cfg.model,protocol:cfg.protocol,prompt:'只回复两个字：正常'})
  .then(function(j){box.textContent='✅ 连接成功，模型返回：'+(j.text||'').slice(0,30);}).catch(function(e){box.textContent='❌ 失败：'+e.message;});
}
function saveAISet(){
  var cfg=readAISet();
  S.aiCfg={base:cfg.base,model:cfg.model,key:cfg.key,protocol:cfg.protocol};
  saveAICfg();
  var p=S.interviewId?api('POST','/api/aiset',{interviewId:S.interviewId,base:cfg.base,model:cfg.model,key:cfg.key,protocol:cfg.protocol}):Promise.resolve();
  p.then(function(){return refresh(true);}).then(function(){closeModal();render();toast('已保存，服务端已记住');}).catch(function(e){closeModal();render();toast(e.message);});
}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.add('on');}
function closeModal(){stopScan();document.getElementById('modalBg').classList.remove('on');document.getElementById('modal').innerHTML='';document.getElementById('foot').style.display='none';}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target.id==='modalBg')closeModal();});
function leaveSession(){
  var cand=S.scoreCand;
  var finish=function(){stopPolling();setSession(null);render();};
  if(cand){flushNotes(cand).then(finish).catch(finish);}else finish();
}

/* ---------------------------- 雷达图 ---------------------------- */
function radarMini(perDim){
  if(perDim.length<3)return '';
  var N=perDim.length,cx=52,cy=52,R=40;
  function ang(i){return (-Math.PI/2)+i*2*Math.PI/N;}
  var outer=perDim.map(function(_,i){var a=ang(i);return [cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  var data=perDim.map(function(p,i){var a=ang(i);var rr=(Math.max(0,(p.avg||0))/DIM_SCALE)*R;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)];});
  var poly=outer.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
  var dpoly=data.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
  return '<svg width="104" height="104" viewBox="0 0 104 104">'+
    '<polygon points="'+poly+'" fill="none" stroke="rgba(120,120,128,.25)" stroke-width="1"/>'+
    outer.map(function(q){return '<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="rgba(120,120,128,.18)" stroke-width=".6"/>';}).join('')+
    '<polygon points="'+dpoly+'" fill="rgba(0,113,227,.18)" stroke="#0071e3" stroke-width="1.6"/></svg>';
}

/* ---------------------------- 启动 ---------------------------- */
var _rzT;
window.addEventListener('resize',function(){clearTimeout(_rzT);_rzT=setTimeout(function(){if(S.role==='host'&&S.tab==='canvas')render();},200);});
window.addEventListener('DOMContentLoaded',function(){
  loadAICfg();
  try{
    var qj=new URLSearchParams(location.search).get('join');
    if(qj)S.pendingJoin=String(qj).trim().toUpperCase();
  }catch(e){}
  if(loadSession()){startPolling();refresh(true);}
  else render();
});
</script>
